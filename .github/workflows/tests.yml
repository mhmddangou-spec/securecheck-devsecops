
name: SecureCheck - Tests Python

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Installer les outils
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff bandit

      - name: Verifier la qualite du code avec Ruff
        run: |
          ruff check securecheck.py securecheck_core.py test_securecheck.py

      - name: Analyser la securite avec Bandit
        run: |
          bandit securecheck.py securecheck_core.py

      - name: Executer les tests
        run: python -m unittest discover -v
